<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOVE ANALYST PRO</title>
    <style>
        :root { --p: #00f2ff; --s: #7000ff; --win: #00ff88; --loss: #ff3e3e; --bg: #0a0a0c; --card: #16161a; }
        body { font-family: 'Inter', 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #e0e0e0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Header & Balance Meter */
        .header { width: 100%; max-width: 900px; text-align: center; margin-bottom: 25px; }
        .meter-container { width: 100%; height: 12px; background: #222; border-radius: 6px; margin: 20px 0; overflow: hidden; display: flex; }
        #meter-left { width: 50%; background: var(--p); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        #meter-right { width: 50%; background: var(--s); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .status-pill { padding: 10px 20px; border-radius: 30px; font-weight: 800; text-transform: uppercase; font-size: 0.9em; letter-spacing: 1px; border: 1px solid rgba(255,255,255,0.1); display: inline-block; transition: 0.3s; }
        .win-state { background: rgba(0, 255, 136, 0.1); color: var(--win); border-color: var(--win); box-shadow: 0 0 15px rgba(0,255,136,0.2); }
        .loss-state { background: rgba(255, 62, 62, 0.1); color: var(--loss); border-color: var(--loss); box-shadow: 0 0 15px rgba(255,62,62,0.2); }

        /* Main Workspace */
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 900px; }
        .side-panel { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); min-height: 250px; }
        .side-header { font-size: 0.75em; font-weight: 800; color: #888; text-transform: uppercase; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .total-display { font-size: 2.2em; font-weight: 900; color: #fff; margin-bottom: 10px; }
        
        /* Item Lists */
        .item-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
        .trade-item { background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .btn-rm { color: #555; cursor: pointer; font-weight: bold; padding-left: 10px; transition: 0.2s; }
        .btn-rm:hover { color: var(--loss); }

        /* Database Section */
        .db-section { width: 100%; max-width: 900px; margin-top: 30px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; padding: 15px; background: var(--card); border: 1px solid #333; border-radius: 12px; color: #fff; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(0,242,255,0.1); }
        
        .side-toggle { display: flex; background: #111; border-radius: 12px; padding: 5px; width: 250px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; color: #666; background: transparent; transition: 0.3s; }
        .toggle-btn.active.you { background: var(--p); color: #000; }
        .toggle-btn.active.them { background: var(--s); color: #fff; }

        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; background: #0e0e11; padding: 15px; border-radius: 16px; max-height: 400px; overflow-y: auto; border: 1px solid #222; }
        .card { background: var(--card); border: 1px solid #333; padding: 12px; border-radius: 12px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; }
        .card:hover { border-color: #666; transform: translateY(-2px); background: #1c1c22; }
        .card b { display: block; font-size: 1.2em; margin-top: 5px; color: var(--p); }
        .card span { font-size: 0.7em; color: #777; text-transform: uppercase; font-weight: 700; }
        
        /* Category Colors */
        .tag-big { color: #ffae00 !important; }
        .tag-spacial { color: #00e5ff !important; }
        .tag-synth { color: #ff00ff !important; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div id="status" class="status-pill">Ready to Scan</div>
        <div class="meter-container">
            <div id="meter-left"></div>
            <div id="meter-right"></div>
        </div>
    </div>

    <div class="workspace">
        <div class="side-panel">
            <div class="side-header">PLAYER (YOU) <span style="color:var(--p)">●</span></div>
            <div id="yTotal" class="total-display">0.00</div>
            <div id="yList" class="item-list"></div>
        </div>
        <div class="side-panel">
            <div class="side-header">TARGET (THEM) <span style="color:var(--s)">●</span></div>
            <div id="tTotal" class="total-display">0.00</div>
            <div id="tList" class="item-list"></div>
        </div>
    </div>

    <div class="db-section">
        <div class="controls">
            <input type="text" id="search" class="search-input" placeholder="Search gloves or serials..." onkeyup="render()">
            <div class="side-toggle">
                <button id="btnY" class="toggle-btn active you" onclick="setT('you')">YOU</button>
                <button id="btnT" class="toggle-btn them" onclick="setT('them')">THEM</button>
            </div>
        </div>
        <div id="inv" class="inventory-grid"></div>
    </div>

<script>
    let activeSide = 'you';
    let yItems = [];
    let tItems = [];

    const data = [
        {n:"Big [1-10]", v:13.75, c:"big"}, {n:"Big [10-100]", v:10, c:"big"}, {n:"Big [100-500]", v:8.75, c:"big"},
        {n:"Big [500-1000]", v:6.75, c:"big"}, {n:"Big [1000-2000]", v:5, c:"big"}, {n:"Big [2000-3000]", v:4.25, c:"big"},
        {n:"Big [3000-4000]", v:3.75, c:"big"}, {n:"Big [4000+]", v:3, c:"big"},
        {n:"Spacial [1-10]", v:10, c:"spacial"}, {n:"Spacial [10-100]", v:7.5, c:"spacial"}, {n:"Spacial [100-500]", v:6.25, c:"spacial"},
        {n:"Spacial [500-1000]", v:4, c:"spacial"}, {n:"Spacial [1000-2000]", v:3.75, c:"spacial"}, {n:"Spacial [2000-3000]", v:2.5, c:"spacial"},
        {n:"Spacial [3000+]", v:2, c:"spacial"},
        {n:"Synthwave [1-10]", v:8.75, c:"synth"}, {n:"Synthwave [10-100]", v:6.25, c:"synth"}, {n:"Synthwave [100-500]", v:4.5, c:"synth"},
        {n:"Synthwave [500-1000]", v:3.5, c:"synth"}, {n:"Synthwave [1000-2000]", v:2.5, c:"synth"}, {n:"Synthwave [2000+]", v:2, c:"synth"},
        {n:"Chess [1-10]", v:6.25, c:"chess"}, {n:"Chess [10-100]", v:3.75, c:"chess"}, {n:"Chess [100-500]", v:2.5, c:"chess"},
        {n:"Chess [500-1000]", v:1.75, c:"chess"}, {n:"Chess [1000-4000]", v:1.25, c:"chess"}, {n:"Chess [4000+]", v:0.75, c:"chess"},
        {n:"X Raw [1-10]", v:5, c:"raw"}, {n:"X Raw [10-100]", v:3.5, c:"raw"}, {n:"X Raw [100-500]", v:2, c:"raw"}, {n:"X Raw [500+]", v:1.5, c:"raw"},
        {n:"Earth", v:1, c:"misc"}, {n:"Reactor", v:1.1, c:"misc"}, {n:"Chains", v:0.45, c:"misc"},
        {n:"Platinum", v:0.4, c:"misc"}, {n:"Za Warudo", v:0.4, c:"misc"}, {n:"Accelerator", v:0.2, c:"misc"},
        {n:"Chaser", v:0.3, c:"misc"}, {n:"Danger", v:0.35, c:"misc"}, {n:"The Po0p", v:0.3, c:"misc"},
        {n:"Dumbfounded", v:0.2, c:"misc"}, {n:"Poison", v:0.25, c:"misc"}, {n:"Spooky Slash", v:0.25, c:"misc"},
        {n:"Spooky Splash", v:0.2, c:"misc"}, {n:"Diamond", v:0.2, c:"misc"}, {n:"Roux Vuitton", v:0.2, c:"misc"},
        {n:"Meltdown", v:0.2, c:"misc"}, {n:"Aperture", v:0.15, c:"misc"}, {n:"Enchanted", v:0.15, c:"misc"}
    ];

    function setT(side) {
        activeSide = side;
        document.getElementById('btnY').classList.toggle('active', side === 'you');
        document.getElementById('btnT').classList.toggle('active', side === 'them');
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        document.getElementById('inv').innerHTML = data
            .filter(i => i.n.toLowerCase().includes(q))
            .map(i => `
                <div class="card" onclick="addItem('${i.n}', ${i.v})">
                    <span class="tag-${i.c}">${i.c}</span>
                    <b>${i.v}</b>
                    <div style="font-size:0.85em; margin-top:4px;">${i.n}</div>
                </div>
            `).join('');
    }

    function addItem(n, v) {
        if (activeSide === 'you') yItems.push({n, v}); else tItems.push({n, v});
        update();
    }

    function removeItem(side, index) {
        if (side === 'y') yItems.splice(index, 1); else tItems.splice(index, 1);
        update();
    }

    function update() {
        const yT = yItems.reduce((a, b) => a + b.v, 0);
        const tT = tItems.reduce((a, b) => a + b.v, 0);
        
        document.getElementById('yTotal').innerText = yT.toFixed(2);
        document.getElementById('tTotal').innerText = tT.toFixed(2);
        
        // Update Meter
        const total = yT + tT;
        const leftPerc = total === 0 ? 50 : (yT / total) * 100;
        const rightPerc = total === 0 ? 50 : (tT / total) * 100;
        document.getElementById('meter-left').style.width = leftPerc + "%";
        document.getElementById('meter-right').style.width = rightPerc + "%";

        // Lists
        document.getElementById('yList').innerHTML = yItems.map((it, i) => `
            <div class="trade-item"><span>${it.n}</span> <span>${it.v} <span class="btn-rm" onclick="removeItem('y', ${i})">✕</span></span></div>
        `).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) => `
            <div class="trade-item"><span>${it.n}</span> <span>${it.v} <span class="btn-rm" onclick="removeItem('t', ${i})">✕</span></span></div>
        `).join('');

        // Status
        const status = document.getElementById('status');
        const diff = tT - yT;
        if (total === 0) {
            status.innerText = "System Ready";
            status.className = "status-pill";
        } else if (diff > 0.01) {
            status.innerText = "Profit: +" + diff.toFixed(2);
            status.className = "status-pill win-state";
        } else if (diff < -0.01) {
            status.innerText = "Loss: " + diff.toFixed(2);
            status.className = "status-pill loss-state";
        } else {
            status.innerText = "Fair Trade";
            status.className = "status-pill";
        }
    }

    render();
</script>
</body>
</html>

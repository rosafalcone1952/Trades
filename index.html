<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLOVE GOD V14: OVERDRIVE</title>
    <style>
        :root { --p: #00f2ff; --s: #bc00ff; --win: #00ffa2; --loss: #ff2e5b; --bg: #050506; --card: rgba(20, 20, 22, 0.8); }
        * { box-sizing: border-box; font-family: 'Orbitron', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at top, #101015 0%, var(--bg) 100%); 
            color: #fff; margin: 0; padding: 15px; overflow-x: hidden; min-height: 100vh;
        }

        /* Smooth Scanner Header */
        .scanner-top {
            width: 100%; padding: 25px; border-radius: 20px; text-align: center;
            font-size: 1.6rem; font-weight: 900; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1); background: var(--card);
            backdrop-filter: blur(10px); transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            letter-spacing: 4px; text-transform: uppercase; position: relative; overflow: hidden;
        }
        .scanner-top::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent);
            transform: rotate(45deg); animation: shine 3s infinite;
        }
        @keyframes shine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
        
        .win-glow { border-color: var(--win); color: var(--win); box-shadow: 0 0 30px rgba(0,255,162,0.2); }
        .loss-glow { border-color: var(--loss); color: var(--loss); box-shadow: 0 0 30px rgba(255,46,91,0.2); }
        .fair-glow { border-color: var(--p); color: var(--p); box-shadow: 0 0 30px rgba(0,242,255,0.2); }

        /* Trade Panels */
        .trade-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .panel { 
            flex: 1; min-width: 300px; background: var(--card); border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 24px; padding: 20px; transition: 0.4s; position: relative;
        }
        .val-text { font-size: 3.5rem; text-align: center; font-weight: 900; margin: 10px 0; font-family: 'monospace'; }

        /* Floating Controls */
        .search-area { position: sticky; top: 10px; z-index: 100; margin-bottom: 25px; }
        .search-input { 
            width: 100%; padding: 20px; border-radius: 15px; border: 1px solid #333; 
            background: rgba(0,0,0,0.8); color: #fff; font-size: 1.1rem; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .side-toggle { display: flex; gap: 10px; margin-top: 10px; }
        .tgl-btn { 
            flex: 1; padding: 18px; border-radius: 12px; border: none; font-weight: 900; 
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }

        /* Item Cards */
        .inventory { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .item { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.05); padding: 18px; 
            border-radius: 18px; text-align: center; transition: 0.2s; cursor: pointer;
        }
        .item:hover { transform: translateY(-5px); border-color: var(--p); background: rgba(255,255,255,0.05); }
        .item b { display: block; font-size: 1.4rem; color: var(--win); margin: 5px 0; }
        .u-tag { font-size: 0.6rem; color: #666; text-transform: uppercase; border: 1px solid #333; padding: 2px 6px; border-radius: 4px; }

        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin-top: 8px;
            font-size: 0.85rem; border-left: 4px solid; animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .rm-btn { color: var(--loss); font-weight: 900; cursor: pointer; padding: 5px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="status" class="scanner-top fair-glow">Initializing System...</div>

    <div class="trade-grid">
        <div class="panel" style="border-bottom: 5px solid var(--p);">
            <div style="font-size: 0.7rem; color: #555; text-align: center; letter-spacing: 2px;">PLAYER SIDE</div>
            <div id="yVal" class="val-text" style="color:var(--p)">0.00</div>
            <div id="yList"></div>
        </div>
        <div class="panel" style="border-bottom: 5px solid var(--s);">
            <div style="font-size: 0.7rem; color: #555; text-align: center; letter-spacing: 2px;">OPPONENT SIDE</div>
            <div id="tVal" class="val-text" style="color:var(--s)">0.00</div>
            <div id="tList"></div>
        </div>
    </div>

    <div class="search-area">
        <input type="text" id="query" class="search-input" placeholder="SEARCH DATABASE (CLASS X/S/FLY)..." onkeyup="render()">
        <div class="side-toggle">
            <button id="btnY" class="tgl-btn" style="background:var(--p); color:#000" onclick="setSide('y')">Player</button>
            <button id="btnT" class="tgl-btn" style="background:#151515; color:#fff" onclick="setSide('t')">Opponent</button>
        </div>
    </div>

    <div id="inv" class="inventory"></div>

<script>
    let side = 'y'; let yItems = []; let tItems = [];
    
    const data = [
        // CLASS X - THE HEAVIES
        {n:"skibidi toilet", v:0, u:"N/A", d:"Insane"},
        {n:"Brush [1-10]", v:1900, u:"Currency", d:"Good"},
        {n:"Blackmarket", v:1400, u:"Currency", d:"Bad"},
        {n:"Tetro", v:1100, u:"Currency", d:"Bad"},
        {n:"M134 [1-5]", v:1015, u:"Currency", d:"Insane"},
        {n:"M134 High [63+]", v:700, u:"Currency", d:"Insane"},
        {n:"MP5 [1-5]", v:760, u:"Currency", d:"Insane"},
        {n:"MP5 High [69+]", v:525, u:"Currency", d:"Insane"},
        
        // CLASS S - ELITES
        {n:"BIGGER [1-5]", v:625, u:"Currency", d:"Decent"},
        {n:"BIGGER High [71+]", v:400, u:"Currency", d:"Good"},
        {n:"Runes [1-5]", v:575, u:"Currency", d:"Decent"},
        {n:"Runes High [77+]", v:345, u:"Currency", d:"Decent"},
        {n:"Chainsaw [1-5]", v:340, u:"Currency", d:"Good"},
        {n:"Chainsaw High [106+]", v:245, u:"Currency", d:"Good"},
        {n:"Kitty", v:400, u:"Currency", d:"Good"},
        {n:"M1911", v:350, u:"Currency", d:"Decent"},
        {n:"Frostbite [1-5]", v:300, u:"Currency", d:"Mid"},
        
        // THE CYBERFLY SPECTRUM
        {n:"Cyberfly [BLK]", v:40, u:"Currency", d:"Good"},
        {n:"Cyberfly [RED]", v:25, u:"Currency", d:"Decent"},
        {n:"Cyberfly [CYAN]", v:35, u:"Currency", d:"Good"},
        {n:"Cyberfly [LIME]", v:20, u:"Currency", d:"Decent"},
        {n:"Cyberfly [PINK]", v:30, u:"Currency", d:"Good"},
        {n:"Cyberfly [GOLD]", v:55, u:"Currency", d:"Insane"},
        {n:"Cyberfly [WHITE]", v:45, u:"Currency", d:"Good"},
        {n:"Cyberfly [PURP]", v:22, u:"Currency", d:"Mid"},
        
        // MIDS & LOWS
        {n:"Chocos", v:80, u:"Currency", d:"Good"},
        {n:"Korone [1-10]", v:70, u:"Currency", d:"Good"},
        {n:"Nuclear [1-10]", v:52.5, u:"Currency", d:"Decent"},
        {n:"Chronos", v:45, u:"Currency", d:"Good"},
        {n:"Mecha", v:18, u:"Currency", d:"Decent"},
        {n:"Big [1-10]", v:13.75, u:"Currency", d:"Mid"},
        {n:"Synth [1-10]", v:8.75, u:"Currency", d:"Bad"},
        {n:"Runic", v:8, u:"Currency", d:"Decent"},
        {n:"Reactor", v:1.1, u:"Currency", d:"Good"},
        {n:"Earth", v:1, u:"Currency", d:"Mid"},
        
        // BLOXES
        {n:"Champion", v:6.25, u:"Bloxes", d:"Good"},
        {n:"Gold", v:6.25, u:"Bloxes", d:"Good"},
        {n:"Dos", v:5, u:"Bloxes", d:"Decent"},
        {n:"Chains", v:3.5, u:"Bloxes", d:"Good"},
        {n:"Slaughter", v:2.5, u:"Bloxes", d:"Good"}
    ];

    function calculate(v, d, u) {
        if (u === "N/A") return 0;
        let base = (u === "Bloxes") ? v * 0.05 : v;
        let m = d.toLowerCase();
        if (m.includes("insane")) return base * 1.1;
        if (m.includes("good")) return base * 1.05;
        if (m.includes("bad")) return base * 0.9;
        return base;
    }

    function setSide(s) {
        side = s;
        document.getElementById('btnY').style.background = side === 'y' ? 'var(--p)' : '#151515';
        document.getElementById('btnY').style.color = side === 'y' ? '#000' : '#fff';
        document.getElementById('btnT').style.background = side === 't' ? 'var(--s)' : '#151515';
    }

    function render() {
        const q = document.getElementById('query').value.toLowerCase();
        document.getElementById('inv').innerHTML = data.filter(i => i.n.toLowerCase().includes(q)).sort((a,b)=>b.v-a.v).map(i => `
            <div class="item" onclick="add('${i.n}', ${i.v}, '${i.d}', '${i.u}')">
                <span class="u-tag">${i.u}</span>
                <b>${i.v}</b>
                <div style="font-size:0.7rem; color:#888">${i.n}</div>
            </div>
        `).join('');
    }

    function add(n, v, d, u) {
        const val = calculate(v, d, u);
        if (side === 'y') yItems.push({n, val}); else tItems.push({n, val});
        update();
    }

    function update() {
        const yT = yItems.reduce((a, b) => a + b.val, 0);
        const tT = tItems.reduce((a, b) => a + b.val, 0);
        document.getElementById('yVal').innerText = yT.toFixed(2);
        document.getElementById('tVal').innerText = tT.toFixed(2);
        
        document.getElementById('yList').innerHTML = yItems.map((it, i) => `<div class="list-item" style="border-color:var(--p)">${it.n} <span class="rm-btn" onclick="yItems.splice(${i},1);update()">✕</span></div>`).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) => `<div class="list-item" style="border-color:var(--s)">${it.n} <span class="rm-btn" onclick="tItems.splice(${i},1);update()">✕</span></div>`).join('');
        
        const b = document.getElementById('status'); const diff = tT - yT;
        if (yT + tT === 0) { b.innerText = "OVERDRIVE SCANNER"; b.className = "scanner-top fair-glow"; }
        else if (diff > 0.01) { b.innerText = "PROFIT (+" + diff.toFixed(2) + ")"; b.className = "scanner-top win-glow"; }
        else if (diff < -0.01) { b.innerText = "LOSS (" + diff.toFixed(2) + ")"; b.className = "scanner-top loss-glow"; }
        else { b.innerText = "FAIR OFFER"; b.className = "scanner-top fair-glow"; }
    }
    setSide('y'); render();
</script>
</body>
</html>

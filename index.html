        .win-glow { border-color: var(--win); color: var(--win); box-shadow: 0 0 30px rgba(0,255,136,0.2); }
        .loss-glow { border-color: var(--loss); color: var(--loss); box-shadow: 0 0 30px rgba(255,62,62,0.2); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; backdrop-filter: blur(15px); box-shadow: inset 0 0 20px rgba(255,255,255,0.02); }

        .search-box { width: 100%; padding: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--p); border-radius: 15px; color: #fff; font-size: 1.2em; outline: none; margin-bottom: 15px; transition: 0.3s; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        .search-box:focus { box-shadow: 0 0 15px var(--p); }
        .t-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: 900; text-transform: uppercase; transition: 0.3s; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
        .tier-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tier-btn { padding: 10px 16px; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; cursor: pointer; font-weight: 900; text-transform: uppercase; transition: 0.3s; font-family: 'Orbitron', sans-serif; font-size: 0.75em; letter-spacing: 1px; background: rgba(255,255,255,0.04); color: #aaa; }

        .tier-btn.t-x.active   { background: linear-gradient(90deg,#ff0000,#ff7700,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000); background-size: 200% 100%; animation: rgbShift 2s linear infinite; border-color: transparent; box-shadow: 0 0 16px rgba(255,0,255,0.5); }

        .tier-btn.t-ss.active  { background: #ff6600; border-color: #ff6600; box-shadow: 0 0 12px rgba(255,102,0,0.5); }

        .lx  { background: linear-gradient(90deg,#ff0000,#ff7700,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000); background-size: 200% 100%; animation: rgbShift 2s linear infinite; color: #000; }

    function setT(t) {
        target = t;
        document.getElementById('btnY').style.background = target === 'you' ? 'var(--p)' : '#222';
        document.getElementById('btnY').style.color = target === 'you' ? '#000' : '#fff';
        document.getElementById('btnT').style.background = target === 'them' ? 'var(--s)' : '#222';
        document.getElementById('btnT').style.color = '#fff';
        render();
    }

    function setTier(tier) {
        activeTier = tier;
        document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.t-' + tier).classList.add('active');
        render();
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = data
            .filter(i => (activeTier === 'all' || i.t === activeTier) && i.n.toLowerCase().includes(q))
            .sort((a, b) => b.v - a.v);
        document.getElementById('inv').innerHTML = filtered.map(i => `
            <div class="card" onclick="add('${i.n.replace(/'/g,"\\'")}', ${i.v}, '${i.u}')">
                <span class="tier-label l${i.t}">${i.t.toUpperCase()} TIER</span><br>
                <span class="tag">${i.u}</span><br>
                ${i.n}<br><b>${i.v}</b>
            </div>
        `).join('');
    }

    function add(n, v, u) {
        if (target === 'you') yItems.push({n, v, u}); else tItems.push({n, v, u});
        upd();
    }

    function remove(side, i) {
        if (side === 'y') yItems.splice(i, 1); else tItems.splice(i, 1);
        upd();
    }

    function upd() {
        const yT = yItems.reduce((a, b) => a + b.v, 0);
        const tT = tItems.reduce((a, b) => a + b.v, 0);
        document.getElementById('yTotal').innerText = yT.toFixed(2);
        document.getElementById('tTotal').innerText = tT.toFixed(2);
        document.getElementById('yList').innerHTML = yItems.map((it, i) =>
            `<div class="item" style="border-left-color:var(--p)">${it.n} <span class="tag">${it.v} ${it.u}</span> <span class="rem" onclick="remove('y',${i})">✕</span></div>`
        ).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) =>
            `<div class="item" style="border-left-color:var(--s)">${it.n} <span class="tag">${it.v} ${it.u}</span> <span class="rem" onclick="remove('t',${i})">✕</span></div>`
        ).join('');
        const b = document.getElementById('banner');
        const d = tT - yT;
        if (yT === 0 && tT === 0) { b.innerText = "System Ready"; b.className = "banner"; }
        else if (d > 0.01) { b.innerText = "PROFIT DETECTED (+" + d.toFixed(2) + ")"; b.className = "banner win-glow"; }
        else if (d < -0.01) { b.innerText = "DEFICIT WARNING (" + d.toFixed(2) + ")"; b.className = "banner loss-glow"; }
        else { b.innerText = "STABLE TRADE"; b.className = "banner"; }
    }

    setT('you');
    render();
</script>

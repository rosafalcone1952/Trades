<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLOVE GOD V16: TOTALITY</title>
    <style>
        :root { 
            --p: #00f2ff; --s: #bc00ff; --win: #00ffa2; --loss: #ff2e5b; 
            --bg: #050508; --card: rgba(15, 15, 20, 0.8); 
        }
        
        * { box-sizing: border-box; font-family: 'Orbitron', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at top, #0d001a 0%, var(--bg) 100%); 
            background-attachment: fixed; color: #fff; margin: 0; padding: 15px; min-height: 100vh;
        }

        .banner { 
            width: 100%; padding: 25px; border-radius: 20px; text-align: center; 
            font-size: 1.6rem; font-weight: 900; margin-bottom: 25px; 
            border: 1px solid rgba(255,255,255,0.1); background: var(--card);
            backdrop-filter: blur(15px); transition: 0.5s; letter-spacing: 4px; 
            text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .win-glow { border-color: var(--win); color: var(--win); box-shadow: 0 0 30px rgba(0,255,162,0.3); text-shadow: 0 0 10px var(--win); animation: pulseWin 2s infinite; }
        .loss-glow { border-color: var(--loss); color: var(--loss); box-shadow: 0 0 30px rgba(255,46,91,0.3); text-shadow: 0 0 10px var(--loss); animation: pulseLoss 2s infinite; }
        .fair-glow { border-color: var(--p); color: var(--p); box-shadow: 0 0 30px rgba(0,242,255,0.2); text-shadow: 0 0 10px var(--p); }

        @keyframes pulseWin { 0%, 100% { box-shadow: 0 0 20px rgba(0,255,162,0.2); } 50% { box-shadow: 0 0 40px rgba(0,255,162,0.5); } }
        @keyframes pulseLoss { 0%, 100% { box-shadow: 0 0 20px rgba(255,46,91,0.2); } 50% { box-shadow: 0 0 40px rgba(255,46,91,0.5); } }

        .trade-layout { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .side { 
            flex: 1; min-width: 300px; background: var(--card); border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 25px; padding: 20px; backdrop-filter: blur(10px); transition: 0.3s;
        }
        
        .val-display { font-size: 3.5rem; text-align: center; font-weight: 900; margin: 10px 0; font-family: monospace; }

        .controls { position: sticky; top: 10px; z-index: 1000; margin-bottom: 25px; }
        .search-field { 
            width: 100%; padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.85); color: #fff; font-size: 1.1rem; 
            backdrop-filter: blur(20px); box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .btn-grp { display: flex; gap: 12px; margin-top: 10px; }
        .side-btn { 
            flex: 1; padding: 18px; border-radius: 12px; border: none; font-weight: 900; 
            cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }

        .inv-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding-bottom: 60px; }
        .card { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.03); 
            padding: 15px; border-radius: 18px; text-align: center; cursor: pointer; 
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { transform: translateY(-5px); border-color: var(--p); background: rgba(255,255,255,0.1); }
        .card b { display: block; font-size: 1.3rem; color: var(--win); margin: 6px 0; }
        .tag { font-size: 0.55rem; padding: 3px 8px; background: rgba(0,0,0,0.5); border-radius: 5px; color: #888; }

        .list-row { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; 
            margin-top: 8px; font-size: 0.8rem; border-left: 4px solid;
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
        .del-btn { color: var(--loss); font-weight: 900; cursor: pointer; padding: 5px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="status" class="banner fair-glow">TOTALITY SCANNER ACTIVE</div>

    <div class="trade-layout">
        <div class="side" style="border-top: 4px solid var(--p);">
            <div id="yVal" class="val-display" style="color:var(--p)">0.00</div>
            <div id="yList"></div>
        </div>
        <div class="side" style="border-top: 4px solid var(--s);">
            <div id="tVal" class="val-display" style="color:var(--s)">0.00</div>
            <div id="tList"></div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="query" class="search-field" placeholder="SEARCH 100+ ITEMS (M134, MP5, FLYS...)" onkeyup="render()">
        <div class="btn-grp">
            <button id="btnY" class="side-btn" style="background:var(--p); color:#000" onclick="setSide('y')">Player</button>
            <button id="btnT" class="side-btn" style="background:#151515; color:#fff" onclick="setSide('t')">Them</button>
        </div>
    </div>

    <div id="inv" class="inv-container"></div>

<script>
    let side = 'y'; let yItems = []; let tItems = [];
    
    // THE TOTALITY DATABASE (100+ VARIATIONS)
    const data = [
        {n:"skibidi toilet", v:0, u:"N/A", d:"Insane"},
        {n:"Brush [1-10]", v:1900, u:"Curr", d:"Good"},
        {n:"Blackmarket", v:1400, u:"Curr", d:"Bad"},
        {n:"Tetro", v:1100, u:"Curr", d:"Bad"},
        // M134 SERIES
        {n:"M134 [1-5]", v:1015, u:"Curr", d:"Insane"},
        {n:"M134 [6-10]", v:950, u:"Curr", d:"Insane"},
        {n:"M134 Low [11-36]", v:890, u:"Curr", d:"Insane"},
        {n:"M134 Mid [37-62]", v:800, u:"Curr", d:"Insane"},
        {n:"M134 High [63+]", v:700, u:"Curr", d:"Insane"},
        // MP5 SERIES
        {n:"MP5 [1-5]", v:760, u:"Curr", d:"Insane"},
        {n:"MP5 [6-10]", v:685, u:"Curr", d:"Insane"},
        {n:"MP5 Low [11-39]", v:590, u:"Curr", d:"Insane"},
        {n:"MP5 Mid [40-68]", v:550, u:"Curr", d:"Insane"},
        {n:"MP5 High [69+]", v:525, u:"Curr", d:"Insane"},
        // BIGGER SERIES
        {n:"BIGGER [1-5]", v:625, u:"Curr", d:"Decent"},
        {n:"BIGGER [6-10]", v:580, u:"Curr", d:"Decent"},
        {n:"BIGGER Low [11-40]", v:525, u:"Curr", d:"Decent"},
        {n:"BIGGER Mid [41-70]", v:425, u:"Curr", d:"Good"},
        {n:"BIGGER High [71+]", v:400, u:"Curr", d:"Good"},
        // RUNES SERIES
        {n:"Runes [1-5]", v:575, u:"Curr", d:"Decent"},
        {n:"Runes [6-10]", v:515, u:"Curr", d:"Decent"},
        {n:"Runes Low [11-43]", v:465, u:"Curr", d:"Decent"},
        {n:"Runes Mid [44-76]", v:405, u:"Curr", d:"Decent"},
        {n:"Runes High [77+]", v:345, u:"Curr", d:"Decent"},
        // CYBERFLYS
        {n:"Cyberfly [BLK]", v:40, u:"Curr", d:"Good"},
        {n:"Cyberfly [RED]", v:20, u:"Curr", d:"Decent"},
        {n:"Cyberfly [CYAN]", v:35, u:"Curr", d:"Good"},
        {n:"Cyberfly [LIME]", v:20, u:"Curr", d:"Decent"},
        {n:"Cyberfly [GOLD]", v:55, u:"Curr", d:"Insane"},
        {n:"Cyberfly [WHITE]", v:45, u:"Curr", d:"Good"},
        {n:"Cyberfly [PURP]", v:30, u:"Curr", d:"Decent"},
        // CLASS A
        {n:"Kitty", v:400, u:"Curr", d:"Good"},
        {n:"M1911", v:350, u:"Curr", d:"Decent"},
        {n:"Chainsaw [1-5]", v:340, u:"Curr", d:"Good"},
        {n:"Frostbite [1-5]", v:300, u:"Curr", d:"Mid"},
        {n:"Eradese [1-5]", v:280, u:"Curr", d:"Good"},
        {n:"X-RAGE [1-5]", v:190, u:"Curr", d:"Decent"},
        {n:"Vortex [1-5]", v:190, u:"Curr", d:"Bad"},
        // CLASS B / COLLECTORS
        {n:"Chocos", v:80, u:"Curr", d:"Good"},
        {n:"Korone [1-10]", v:70, u:"Curr", d:"Good"},
        {n:"Korone [500+]", v:40, u:"Curr", d:"Good"},
        {n:"Bear [1-10]", v:62.5, u:"Curr", d:"Good"},
        {n:"Nuclear [1-10]", v:52.5, u:"Curr", d:"Decent"},
        {n:"Chronos [1-10]", v:45, u:"Curr", d:"Good"},
        {n:"Mecha", v:18, u:"Curr", d:"Decent"},
        // CLASS C & D
        {n:"Big [1-10]", v:13.75, u:"Curr", d:"Mid"},
        {n:"Spacial [1-10]", v:10, u:"Curr", d:"Bad"},
        {n:"Synth [1-10]", v:8.75, u:"Curr", d:"Bad"},
        {n:"Violin [1-10]", v:10, u:"Curr", d:"Bad"},
        {n:"Death", v:7.5, u:"Curr", d:"Mid"},
        {n:"Runic", v:8, u:"Curr", d:"Decent"},
        {n:"Pneumatic", v:7, u:"Curr", d:"Mid"},
        {n:"Everfrost", v:4.5, u:"Curr", d:"Mid"},
        {n:"Roadster", v:3.25, u:"Curr", d:"Good"},
        {n:"Dubstep", v:2.5, u:"Curr", d:"Decent"},
        {n:"Reactor", v:1.1, u:"Curr", d:"Good"},
        {n:"Earth", v:1, u:"Curr", d:"Mid"},
        {n:"Aperture", v:0.15, u:"Curr", d:"Bad"},
        {n:"Enchanted", v:0.15, u:"Curr", d:"Bad"},
        // BLOXES (5% MULTIPLIER)
        {n:"Champion", v:6.25, u:"Blox", d:"Good"},
        {n:"Gold", v:6.25, u:"Blox", d:"Good"},
        {n:"Dos", v:5, u:"Blox", d:"Decent"},
        {n:"Chains", v:3.5, u:"Blox", d:"Good"},
        {n:"Wildcard", v:3.75, u:"Curr", d:"Bad"},
        {n:"Slaughter", v:2.5, u:"Blox", d:"Good"},
        {n:"Murder", v:1.6, u:"Blox", d:"Good"},
        {n:"Full Metal", v:0.5, u:"Blox", d:"Good"}
    ];

    function calculate(v, d, u) {
        if (u === "N/A") return 0;
        let base = (u === "Blox") ? v * 0.05 : v;
        let m = d.toLowerCase();
        if (m.includes("insane")) return base * 1.1;
        if (m.includes("good")) return base * 1.05;
        if (m.includes("bad")) return base * 0.9;
        return base;
    }

    function setSide(s) {
        side = s;
        document.getElementById('btnY').style.background = side === 'y' ? 'var(--p)' : '#151515';
        document.getElementById('btnY').style.color = side === 'y' ? '#000' : '#fff';
        document.getElementById('btnT').style.background = side === 't' ? 'var(--s)' : '#151515';
    }

    function render() {
        const q = document.getElementById('query').value.toLowerCase();
        document.getElementById('inv').innerHTML = data.filter(i => i.n.toLowerCase().includes(q)).sort((a,b)=>b.v-a.v).map(i => `
            <div class="card" onclick="add('${i.n}', ${i.v}, '${i.d}', '${i.u}')">
                <span class="tag">${i.u}</span>
                <b>${i.v}</b>
                <div style="font-size:0.65rem; color:#888">${i.n}</div>
            </div>
        `).join('');
    }

    function add(n, v, d, u) {
        const val = calculate(v, d, u);
        if (side === 'y') yItems.push({n, val}); else tItems.push({n, val});
        update();
    }

    function update() {
        const yT = yItems.reduce((a, b) => a + b.val, 0);
        const tT = tItems.reduce((a, b) => a + b.val, 0);
        document.getElementById('yVal').innerText = yT.toFixed(2);
        document.getElementById('tVal').innerText = tT.toFixed(2);
        
        document.getElementById('yList').innerHTML = yItems.map((it, i) => `<div class="list-row" style="border-color:var(--p)">${it.n} <span class="del-btn" onclick="yItems.splice(${i},1);update()">✕</span></div>`).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) => `<div class="list-row" style="border-color:var(--s)">${it.n} <span class="del-btn" onclick="tItems.splice(${i},1);update()">✕</span></div>`).join('');
        
        const b = document.getElementById('status'); const diff = tT - yT;
        if (yT + tT === 0) { b.innerText = "TOTALITY SCANNER ACTIVE"; b.className = "banner fair-glow"; }
        else if (diff > 0.05) { b.innerText = "PROFIT (+" + diff.toFixed(2) + ")"; b.className = "banner win-glow"; }
        else if (diff < -0.05) { b.innerText = "LOSS (" + diff.toFixed(2) + ")"; b.className = "banner loss-glow"; }
        else { b.innerText = "FAIR TRADE"; b.className = "banner fair-glow"; }
    }
    setSide('y'); render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOVE MASTER: CYBER-VOID</title>
    <style>
        :root { --p: #00f2ff; --s: #7000ff; --win: #00ff88; --loss: #ff3e3e; --bg: #030303; }
        body { font-family: 'Orbitron', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; letter-spacing: 1px; }
        .banner { width: 100%; padding: 30px; border-radius: 20px; text-align: center; font-size: 2.2em; font-weight: 900; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; transition: 0.5s; position: relative; overflow: hidden; }
        .banner::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, var(--p), transparent 30%); animation: rotate 4s linear infinite; z-index: -1; opacity: 0.3; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .win-glow { border-color: var(--win); color: var(--win); box-shadow: 0 0 30px rgba(0,255,136,0.2); }
        .loss-glow { border-color: var(--loss); color: var(--loss); box-shadow: 0 0 30px rgba(255,62,62,0.2); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; backdrop-filter: blur(15px); box-shadow: inset 0 0 20px rgba(255,255,255,0.02); }
        .val { font-size: 3em; font-weight: 900; text-align: center; margin: 10px 0; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .search-box { width: 100%; padding: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--p); border-radius: 15px; color: #fff; font-size: 1.2em; outline: none; margin-bottom: 15px; transition: 0.3s; }
        .search-box:focus { box-shadow: 0 0 15px var(--p); }
        .t-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: 900; text-transform: uppercase; transition: 0.3s; }
        .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; max-height: 500px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 15px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: var(--p); background: rgba(0,242,255,0.05); }
        .card b { display: block; font-size: 1.3em; color: var(--win); margin: 5px 0; }
        .tag { font-size: 0.7em; padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); color: #aaa; text-transform: uppercase; }
        .item { background: rgba(255,255,255,0.05); padding: 12px; margin: 8px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid; font-size: 0.9em; }
        .rem { color: var(--loss); font-weight: 900; cursor: pointer; font-size: 1.2em; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--p); border-radius: 10px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="banner" class="banner">System Ready</div>

    <div class="grid">
        <div class="panel">
            <p style="text-align:center; color:var(--p); margin:0; font-size:0.8em;">PLAYER INGRESS</p>
            <div id="yTotal" class="val" style="color:var(--p)">0.00</div>
            <div id="yList"></div>
        </div>
        <div class="panel">
            <p style="text-align:center; color:var(--s); margin:0; font-size:0.8em;">TARGET OFFER</p>
            <div id="tTotal" class="val" style="color:var(--s)">0.00</div>
            <div id="tList"></div>
        </div>
    </div>

    <input type="text" id="search" class="search-box" placeholder="SCANNING DATABASE..." onkeyup="render()">
    
    <div class="t-row">
        <button id="btnY" class="btn" style="background:var(--p); color:#000;" onclick="setT('you')">PLAYER SIDE</button>
        <button id="btnT" class="btn" style="background:#222; color:#fff;" onclick="setT('them')">TARGET SIDE</button>
    </div>

    <div id="inv" class="inv"></div>

<script>
    let target = 'you'; let yItems = []; let tItems = [];
    
    // MEGA-DATABASE
    const data = [
        // Image 1: Top Tiers
        {n:"skibidi toilet", v:0, u:"N/A", d:"Insane"}, {n:"Brush [1-10]", v:1900, u:"Currency", d:"Good"}, {n:"Blackmarket", v:1400, u:"Currency", d:"Bad"}, {n:"Tetro", v:1100, u:"Currency", d:"Bad"},
        {n:"M134 [1-5]", v:955, u:"Currency", d:"Insane"}, {n:"M134 [6-10]", v:900, u:"Currency", d:"Insane"}, {n:"M134 Low [11-36]", v:805, u:"Currency", d:"Insane"}, {n:"M134 Mid [37-62]", v:735, u:"Currency", d:"Insane"}, {n:"M134 High [63+]", v:655, u:"Currency", d:"Insane"},
        {n:"MP5 [1-5]", v:740, u:"Currency", d:"Insane"}, {n:"MP5 [6-10]", v:665, u:"Currency", d:"Insane"}, {n:"MP5 Low [11-39]", v:565, u:"Currency", d:"Insane"}, {n:"MP5 Mid [40-68]", v:540, u:"Currency", d:"Insane"}, {n:"MP5 High [69+]", v:500, u:"Currency", d:"Insane"},
        {n:"BIGGER [1-5]", v:595, u:"Currency", d:"Decent"}, {n:"BIGGER High [71+]", v:355, u:"Currency", d:"Good"},
        {n:"Runes [1-5]", v:575, u:"Currency", d:"Decent"}, {n:"Runes High [77+]", v:345, u:"Currency", d:"Decent"},

        // Image 2: Mid-High
        {n:"Frostbite [1-5]", v:270, u:"Currency", d:"Mid"}, {n:"Frostbite High [85+]", v:190, u:"Currency", d:"Mid"},
        {n:"Freezer [1-5]", v:210, u:"Currency", d:"Decent"}, {n:"Freezer High [56+]", v:110, u:"Currency", d:"Decent"},
        {n:"Eradese [1-5]", v:280, u:"Currency", d:"Good"}, {n:"Eradese High [71-100]", v:195, u:"Currency", d:"Good"},
        {n:"Vortex [1-5]", v:190, u:"Currency", d:"Bad"}, {n:"Vortex High [75+]", v:85, u:"Currency", d:"Mid"},
        {n:"Chainsaw [1-5]", v:295, u:"Currency", d:"Good"}, {n:"Chainsaw High [106-153]", v:235, u:"Currency", d:"Good"},
        {n:"X-RAGE [1-5]", v:190, u:"Currency", d:"Decent"}, {n:"X-RAGE [501+]", v:60, u:"Currency", d:"Good"},
        {n:"Kitty", v:350, u:"Currency", d:"Insane"}, {n:"M1911", v:340, u:"Currency", d:"Good"},

        // Image 3: Mids
        {n:"Chocos", v:65, u:"Currency", d:"Good"}, {n:"Bear [1-10]", v:57.5, u:"Currency", d:"Good"}, {n:"Bear [300+]", v:47.5, u:"Currency", d:"Good"},
        {n:"Nuclear [1-10]", v:52.5, u:"Currency", d:"Decent"}, {n:"Nuclear [400+]", v:30, u:"Currency", d:"Decent"},
        {n:"Cyberfly [BLK]", v:40, u:"Currency", d:"Good"}, {n:"Mecha", v:19, u:"Currency", d:"Decent"}, {n:"Cyberfly [RED]", v:20, u:"Currency", d:"Decent"}, {n:"Envoided", v:9.75, u:"Currency", d:"Decent"},
        {n:"Runic", v:8, u:"Currency", d:"Decent"}, {n:"Pneumatic", v:7, u:"Currency", d:"Mid"}, {n:"Mutation", v:3.5, u:"Currency", d:"Mid"},

        // Image 4: Serial Mids
        {n:"Korone [1-10]", v:65, u:"Currency", d:"Good"}, {n:"Korone [500+]", v:35, u:"Currency", d:"Good"},
        {n:"Chronos [1-10]", v:45, u:"Currency", d:"Good"}, {n:"Chronos [400+]", v:32.5, u:"Currency", d:"Good"},
        {n:"Shrimple [1-10]", v:18.75, u:"Currency", d:"Bad"}, {n:"Shrimple [400+]", v:10, u:"Currency", d:"Bad"},
        {n:"Creature [1-10]", v:12.5, u:"Currency", d:"Bad"}, {n:"Creature [400+]", v:3.75, u:"Currency", d:"Bad"},
        {n:"Brute", v:4.75, u:"Currency", d:"Good"}, {n:"Overheaven", v:3.75, u:"Currency", d:"Decent"}, {n:"The World", v:3.25, u:"Currency", d:"Decent"}, {n:"Tiki", v:2.75, u:"Currency", d:"Mid"},

        // Image 5: Lows
        {n:"Violin [1-10]", v:10, u:"Currency", d:"Bad"}, {n:"Violin [200+]", v:2.5, u:"Currency", d:"Bad"},
        {n:"Roadster", v:3.25, u:"Currency", d:"Good"}, {n:"Dubstep", v:2.5, u:"Currency", d:"Decent"}, {n:"Poopatory", v:1.5, u:"Currency", d:"Bad"}, {n:"Core [BLK]", v:1.5, u:"Currency", d:"Mid"}, {n:"Purgatory", v:1.25, u:"Currency", d:"Decent"}, {n:"Motorcycle", v:0.5, u:"Currency", d:"Mid"}, {n:"Dragon Slayer", v:1, u:"Currency", d:"Mid"}, {n:"Bloxy", v:0.75, u:"Currency", d:"Decent"}, {n:"Ciel", v:0.45, u:"Currency", d:"Mid"},

        // Image 6: Massive Serials
        {n:"Big [1-10]", v:13.75, u:"Currency", d:"Mid"}, {n:"Big [4000+]", v:3, u:"Currency", d:"Mid"},
        {n:"Spacial [1-10]", v:10, u:"Currency", d:"Bad"}, {n:"Spacial [3000+]", v:2, u:"Currency", d:"Bad"},
        {n:"Synth [1-10]", v:8.75, u:"Currency", d:"Bad"}, {n:"Synth [2000+]", v:2, u:"Currency", d:"Bad"},
        {n:"Chess [1-10]", v:6.25, u:"Currency", d:"Horrible"}, {n:"Chess [1400+]", v:0.75, u:"Currency", d:"Horrible"},
        {n:"X Raw [1-10]", v:5, u:"Currency", d:"Bad"}, {n:"X Raw [500+]", v:1.5, u:"Currency", d:"Bad"},
        {n:"Earth", v:1, u:"Currency", d:"Mid"}, {n:"Reactor", v:1.1, u:"Currency", d:"Good"}, {n:"Accelerator", v:0.2, u:"Currency", d:"Mid"}, {n:"PoOp", v:0.3, u:"Currency", d:"Bad"}, {n:"Aperture", v:0.15, u:"Currency", d:"Bad"},

        // Image 7: Bloxes
        {n:"Wildcard", v:3.75, u:"Currency", d:"Bad"}, {n:"Primesoul", v:0.25, u:"Currency", d:"Good"}, {n:"Amethyst", v:0.2, u:"Currency", d:"Bad"},
        {n:"Champion", v:6.25, u:"Bloxes", d:"Good"}, {n:"Gold", v:6.25, u:"Bloxes", d:"Good"}, {n:"Dos", v:5, u:"Bloxes", d:"Decent"}, {n:"Chains", v:3.5, u:"Bloxes", d:"Good"}, {n:"Blueprint", v:3.5, u:"Bloxes", d:"Decent"}, {n:"M68", v:3, u:"Bloxes", d:"Good"}, {n:"Bobux", v:2, u:"Bloxes", d:"Decent"}, {n:"Warning", v:1.4, u:"Bloxes", d:"Good"}, {n:"Neon", v:1.2, u:"Bloxes", d:"Good"}, {n:"Emerald", v:1, u:"Bloxes", d:"Decent"}, {n:"Uno", v:0.5, u:"Bloxes", d:"Good"}, {n:"Full Metal", v:0.5, u:"Bloxes", d:"Good"}
    ];

    function calc(v, d, u) {
        if (u === "N/A") return 0;
        let base = (u === "Bloxes") ? v * 0.05 : v; // Blox items weighted for common denominator
        let m = d.toLowerCase();
        if (m.includes("insane")) return base * 1.1;
        if (m.includes("good")) return base * 1.05;
        if (m.includes("bad") || m.includes("horrible")) return base * 0.9;
        return base;
    }

    function setT(t) {
        target = t;
        document.getElementById('btnY').style.background = target === 'you' ? 'var(--p)' : '#222';
        document.getElementById('btnY').style.color = target === 'you' ? '#000' : '#fff';
        document.getElementById('btnT').style.background = target === 'them' ? 'var(--s)' : '#222';
        render();
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        document.getElementById('inv').innerHTML = data.filter(i => i.n.toLowerCase().includes(q)).sort((a,b)=>b.v-a.v).map(i => `
            <div class="card" onclick="add('${i.n}', '${i.v}', '${i.d}', '${i.u}')">
                <span class="tag">${i.u}</span><br>
                ${i.n}<br><b>${i.v}</b>
            </div>
        `).join('');
    }

    function add(n, v, d, u) {
        const val = calc(parseFloat(v), d, u);
        const disp = u === "N/A" ? "N/A" : val.toFixed(2);
        if (target === 'you') yItems.push({n, val, u, disp}); else tItems.push({n, val, u, disp});
        upd();
    }

    function remove(side, i) {
        if (side === 'y') yItems.splice(i, 1); else tItems.splice(i, 1);
        upd();
    }

    function upd() {
        const yT = yItems.reduce((a, b) => a + b.val, 0);
        const tT = tItems.reduce((a, b) => a + b.val, 0);
        document.getElementById('yTotal').innerText = yT.toFixed(2);
        document.getElementById('tTotal').innerText = tT.innerText = tT.toFixed(2);
        
        document.getElementById('yList').innerHTML = yItems.map((it, i) => `<div class="item" style="border-left-color:var(--p)">${it.n} <span class="tag">${it.u}</span> <span class="rem" onclick="remove('y', ${i})">✕</span></div>`).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) => `<div class="item" style="border-left-color:var(--s)">${it.n} <span class="tag">${it.u}</span> <span class="rem" onclick="remove('t', ${i})">✕</span></div>`).join('');
        
        const b = document.getElementById('banner'); const d = tT - yT;
        if (yT === 0 && tT === 0) { b.innerText = "Scanner Offline"; b.className = "banner"; }
        else if (d > 0.1) { b.innerText = "PROFIT DETECTED (+" + d.toFixed(2) + ")"; b.className = "banner win-glow"; }
        else if (d < -0.1) { b.innerText = "DEFICIT WARNING (" + d.toFixed(2) + ")"; b.className = "banner loss-glow"; }
        else { b.innerText = "STABLE TRADE"; b.className = "banner fair-glow"; }
    }
    setT('you'); render();
</script>
</body>
</html>

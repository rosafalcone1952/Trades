<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLOVE GOD V9: CYBER-VOID</title>
    <style>
        :root { --p: #00f2ff; --s: #7000ff; --win: #00ff88; --loss: #ff3e3e; --bg: #050505; --card: #121212; }
        * { box-sizing: border-box; font-family: 'Orbitron', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; margin: 0; padding: 10px; line-height: 1.4; }
        
        /* Fixed Header */
        .header { position: sticky; top: 0; z-index: 100; background: rgba(5,5,5,0.9); backdrop-filter: blur(12px); padding: 10px 0; border-bottom: 1px solid #222; }
        .status-box { width: 100%; padding: 20px; border-radius: 12px; text-align: center; font-size: 1.4rem; font-weight: 900; border: 2px solid #333; text-transform: uppercase; transition: 0.4s; }
        .win { border-color: var(--win); color: var(--win); box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .loss { border-color: var(--loss); color: var(--loss); box-shadow: 0 0 20px rgba(255,62,62,0.2); }

        /* Trade Grid - Responsive Flex */
        .trade-container { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 15px; }
        .side-panel { flex: 1; min-width: 280px; background: var(--card); border: 1px solid #222; border-radius: 16px; padding: 15px; transition: 0.3s; }
        .side-label { font-size: 0.7rem; letter-spacing: 2px; color: #666; text-align: center; margin-bottom: 8px; }
        .total-val { font-size: 2.8rem; text-align: center; font-weight: 900; margin: 10px 0; font-family: monospace; }

        /* Controls Area */
        .controls { margin: 15px 0; }
        .search-bar { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font-size: 1.1rem; margin-bottom: 12px; }
        .search-bar:focus { border-color: var(--p); outline: none; box-shadow: 0 0 15px rgba(0,242,255,0.1); }
        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 16px; border-radius: 10px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }

        /* Inventory Grid */
        .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; padding-bottom: 30px; }
        .item-card { background: var(--card); border: 1px solid #222; padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.15s; }
        .item-card:hover { border-color: var(--p); transform: translateY(-3px); background: rgba(255,255,255,0.05); }
        .item-card b { display: block; color: var(--win); font-size: 1.3rem; margin: 5px 0; }
        .unit-pill { font-size: 0.6rem; color: #888; background: #000; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; border: 1px solid #333; }

        /* List Items */
        .trade-list-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin-top: 8px; font-size: 0.85rem; border-left: 5px solid; }
        .x-btn { color: var(--loss); font-weight: 900; cursor: pointer; font-size: 1.1rem; padding: 0 5px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="header">
        <div id="status" class="status-box">Scanner Ready</div>
    </div>

    <div class="trade-container">
        <div class="side-panel">
            <div class="side-label">PLAYER GIVES</div>
            <div id="yVal" class="total-val" style="color:var(--p)">0.00</div>
            <div id="yList"></div>
        </div>
        <div class="side-panel">
            <div class="side-label">OPPONENT GIVES</div>
            <div id="tVal" class="total-val" style="color:var(--s)">0.00</div>
            <div id="tList"></div>
        </div>
    </div>

    <div class="controls">
        <div class="btn-row">
            <button id="btnY" class="mode-btn" style="background:var(--p); color:#000" onclick="setSide('you')">Player Side</button>
            <button id="btnT" class="mode-btn" style="background:#222; color:#fff" onclick="setSide('them')">Opponent Side</button>
        </div>
        <input type="text" id="query" class="search-bar" placeholder="SEARCH DATABASE..." onkeyup="render()">
    </div>

    <div id="inv" class="inv-grid"></div>

<script>
    let side = 'you'; let yItems = []; let tItems = [];
    
    // YOUR UPDATED VALUES
    const data = [
        {n:"skibidi toilet", v:0, u:"N/A", d:"Insane"}, {n:"Brush [1-10]", v:1900, u:"Currency", d:"Good"}, {n:"Blackmarket", v:1400, u:"Currency", d:"Bad"}, {n:"Tetro", v:1100, u:"Currency", d:"Bad"},
        {n:"M134 [1-5]", v:1015, u:"Currency", d:"Insane"}, {n:"M134 [6-10]", v:950, u:"Currency", d:"Insane"}, {n:"M134 Low [11-36]", v:890, u:"Currency", d:"Insane"}, {n:"M134 Mid [37-62]", v:800, u:"Currency", d:"Insane"}, {n:"M134 High [63+]", v:700, u:"Currency", d:"Insane"},
        {n:"MP5 [1-5]", v:760, u:"Currency", d:"Insane"}, {n:"MP5 [6-10]", v:685, u:"Currency", d:"Insane"}, {n:"MP5 Low [11-39]", v:590, u:"Currency", d:"Insane"}, {n:"MP5 Mid [40-68]", v:550, u:"Currency", d:"Insane"}, {n:"MP5 High [69+]", v:525, u:"Currency", d:"Insane"},
        {n:"BIGGER [1-5]", v:625, u:"Currency", d:"Decent"}, {n:"BIGGER [6-10]", v:580, u:"Currency", d:"Decent"}, {n:"BIGGER Low [11-40]", v:525, u:"Currency", d:"Decent"}, {n:"BIGGER Mid [41-70]", v:425, u:"Currency", d:"Good"}, {n:"BIGGER High [71+]", v:400, u:"Currency", d:"Good"},
        {n:"Runes [1-5]", v:575, u:"Currency", d:"Decent"}, {n:"Runes [6-10]", v:515, u:"Currency", d:"Decent"}, {n:"Runes Low [11-43]", v:465, u:"Currency", d:"Decent"}, {n:"Runes Mid [44-76]", v:405, u:"Currency", d:"Decent"}, {n:"Runes High [77+]", v:345, u:"Currency", d:"Decent"},
        {n:"Frostbite [1-5]", v:300, u:"Currency", d:"Mid"}, {n:"Frostbite [6-10]", v:250, u:"Currency", d:"Mid"}, {n:"Frostbite Low [11-47]", v:230, u:"Currency", d:"Mid"}, {n:"Frostbite Mid [48-84]", v:210, u:"Currency", d:"Mid"}, {n:"Frostbite High [85+]", v:190, u:"Currency", d:"Mid"},
        {n:"Freezer [1-5]", v:210, u:"Currency", d:"Decent"}, {n:"Freezer [6-10]", v:190, u:"Currency", d:"Decent"}, {n:"Freezer Low [11-33]", v:160, u:"Currency", d:"Decent"}, {n:"Freezer Mid [34-55]", v:140, u:"Currency", d:"Decent"}, {n:"Freezer High [56+]", v:110, u:"Currency", d:"Decent"},
        {n:"Eradese [1-5]", v:280, u:"Currency", d:"Good"}, {n:"Eradese Low [11-40]", v:225, u:"Currency", d:"Good"}, {n:"Eradese High [71-100]", v:195, u:"Currency", d:"Good"},
        {n:"Vortex [1-5]", v:190, u:"Currency", d:"Bad"}, {n:"Vortex High [75+]", v:85, u:"Currency", d:"Mid"},
        {n:"Chainsaw [1-5]", v:340, u:"Currency", d:"Good"}, {n:"Chainsaw High [106-153]", v:245, u:"Currency", d:"Good"},
        {n:"X-RAGE [1-5]", v:190, u:"Currency", d:"Decent"}, {n:"X-RAGE [501+]", v:60, u:"Currency", d:"Good"},
        {n:"Kitty", v:400, u:"Currency", d:"Good"}, {n:"M1911", v:350, u:"Currency", d:"Decent"},
        {n:"Chocos", v:80, u:"Currency", d:"Good"}, {n:"Bear [1-10]", v:62.5, u:"Currency", d:"Good"}, {n:"Bear [300+]", v:50, u:"Currency", d:"Good"},
        {n:"Nuclear [1-10]", v:52.5, u:"Currency", d:"Decent"}, {n:"Nuclear [400+]", v:30, u:"Currency", d:"Decent"},
        {n:"Cyberfly [BLK]", v:40, u:"Currency", d:"Good"}, {n:"Cyberfly [RED]", v:20, u:"Currency", d:"Decent"},
        {n:"Korone [1-10]", v:70, u:"Currency", d:"Good"}, {n:"Korone [500+]", v:40, u:"Currency", d:"Good"},
        {n:"Chronos", v:45, u:"Currency", d:"Good"}, {n:"Big [1-10]", v:13.75, u:"Currency", d:"Mid"},
        {n:"Wildcard", v:3.75, u:"Currency", d:"Bad"}, {n:"Champion", v:6.25, u:"Bloxes", d:"Good"},
        {n:"Gold", v:6.25, u:"Bloxes", d:"Good"}, {n:"Dos", v:5, u:"Bloxes", d:"Decent"},
        {n:"Chains", v:3.5, u:"Bloxes", d:"Good"}, {n:"Slaughter", v:2.5, u:"Bloxes", d:"Good"},
        {n:"Murder", v:1.6, u:"Bloxes", d:"Good"}, {n:"Full Metal", v:0.5, u:"Bloxes", d:"Good"}
    ];

    function calc(v, d, u) {
        if (u === "N/A") return 0;
        let base = (u === "Bloxes") ? v * 0.05 : v;
        let m = d.toLowerCase();
        if (m.includes("insane")) return base * 1.1;
        if (m.includes("good")) return base * 1.05;
        if (m.includes("bad") || m.includes("horrible")) return base * 0.9;
        return base;
    }

    function setSide(s) {
        side = s;
        document.getElementById('btnY').style.background = side === 'you' ? 'var(--p)' : '#222';
        document.getElementById('btnY').style.color = side === 'you' ? '#000' : '#fff';
        document.getElementById('btnT').style.background = side === 'them' ? 'var(--s)' : '#222';
        render();
    }

    function render() {
        const q = document.getElementById('query').value.toLowerCase();
        document.getElementById('inv').innerHTML = data.filter(i => i.n.toLowerCase().includes(q)).sort((a,b)=>b.v-a.v).map(i => `
            <div class="item-card" onclick="add('${i.n}', ${i.v}, '${i.d}', '${i.u}')">
                <span class="unit-pill">${i.u}</span>
                <b>${i.v}</b>
                <div style="font-size:0.65rem; color:#888">${i.n}</div>
            </div>
        `).join('');
    }

    function add(n, v, d, u) {
        const val = calc(parseFloat(v), d, u);
        const item = {n, val, u, disp: u === "N/A" ? "N/A" : val.toFixed(2)};
        if (side === 'you') yItems.push(item); else tItems.push(item);
        update();
    }

    function update() {
        const yT = yItems.reduce((a, b) => a + b.val, 0);
        const tT = tItems.reduce((a, b) => a + b.val, 0);
        document.getElementById('yVal').innerText = yT.toFixed(2);
        document.getElementById('tVal').innerText = tT.toFixed(2);
        
        document.getElementById('yList').innerHTML = yItems.map((it, i) => `<div class="trade-list-item" style="border-color:var(--p)">${it.n} <span class="x-btn" onclick="yItems.splice(${i},1);update()">✕</span></div>`).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) => `<div class="trade-list-item" style="border-color:var(--s)">${it.n} <span class="x-btn" onclick="tItems.splice(${i},1);update()">✕</span></div>`).join('');
        
        const b = document.getElementById('status'); const diff = tT - yT;
        if (yT + tT === 0) { b.innerText = "Scanner Ready"; b.className = "status-box"; }
        else if (diff > 0.05) { b.innerText = "PROFIT (+" + diff.toFixed(2) + ")"; b.className = "status-box win"; }
        else if (diff < -0.05) { b.innerText = "LOSS (" + diff.toFixed(2) + ")"; b.className = "status-box loss"; }
        else { b.innerText = "FAIR TRADE"; b.className = "status-box"; }
    }
    setSide('you'); render();
</script>
</body>
</html>

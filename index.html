<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOVE MASTER: CYBER-VOID</title>
    <style>
        :root { --p: #00f2ff; --s: #7000ff; --win: #00ff88; --loss: #ff3e3e; --bg: #030303; }
        body { font-family: 'Orbitron', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; letter-spacing: 1px; }
        .banner { width: 100%; padding: 30px; border-radius: 20px; text-align: center; font-size: 2.2em; font-weight: 900; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; transition: 0.5s; position: relative; overflow: hidden; }
        .banner::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, var(--p), transparent 30%); animation: rotate 4s linear infinite; z-index: -1; opacity: 0.3; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .win-glow { border-color: var(--win); color: var(--win); box-shadow: 0 0 30px rgba(0,255,136,0.2); }
        .loss-glow { border-color: var(--loss); color: var(--loss); box-shadow: 0 0 30px rgba(255,62,62,0.2); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; backdrop-filter: blur(15px); box-shadow: inset 0 0 20px rgba(255,255,255,0.02); }
        .val { font-size: 3em; font-weight: 900; text-align: center; margin: 10px 0; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .search-box { width: 100%; padding: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--p); border-radius: 15px; color: #fff; font-size: 1.2em; outline: none; margin-bottom: 15px; transition: 0.3s; }
        .search-box:focus { box-shadow: 0 0 15px var(--p); }
        .t-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: 900; text-transform: uppercase; transition: 0.3s; }
        .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; max-height: 500px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 15px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: var(--p); background: rgba(0,242,255,0.05); }
        .card b { display: block; font-size: 1.3em; color: var(--win); margin: 5px 0; }
        .tag { font-size: 0.7em; padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); color: #aaa; text-transform: uppercase; }
        .item { background: rgba(255,255,255,0.05); padding: 12px; margin: 8px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid; font-size: 0.9em; }
        .rem { color: var(--loss); font-weight: 900; cursor: pointer; font-size: 1.2em; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--p); border-radius: 10px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="banner" class="banner">System Ready</div>

    <div class="grid">
        <div class="panel">
            <p style="text-align:center; color:var(--p); margin:0; font-size:0.8em;">PLAYER INGRESS</p>
            <div id="yTotal" class="val" style="color:var(--p)">0.00</div>
            <div id="yList"></div>
        </div>
        <div class="panel">
            <p style="text-align:center; color:var(--s); margin:0; font-size:0.8em;">TARGET OFFER</p>
            <div id="tTotal" class="val" style="color:var(--s)">0.00</div>
            <div id="tList"></div>
        </div>
    </div>

    <input type="text" id="search" class="search-box" placeholder="SCANNING DATABASE..." onkeyup="render()">
    
    <div class="t-row">
        <button id="btnY" class="btn" style="background:var(--p); color:#000;" onclick="setT('you')">PLAYER SIDE</button>
        <button id="btnT" class="btn" style="background:#222; color:#fff;" onclick="setT('them')">TARGET SIDE</button>
    </div>

    <div id="inv" class="inv"></div>

<script>
    let target = 'you'; let yItems = []; let tItems = [];
    
    const data = [
        // BIG SERIES
        {n:"Big [1-10]", v:13.75, u:"Currency"},
        {n:"Big [10-100]", v:10, u:"Currency"},
        {n:"Big [100-500]", v:8.75, u:"Currency"},
        {n:"Big [500-1000]", v:6.75, u:"Currency"},
        {n:"Big [1000-2000]", v:5, u:"Currency"},
        {n:"Big [2000-3000]", v:4.25, u:"Currency"},
        {n:"Big [3000-4000]", v:3.75, u:"Currency"},
        {n:"Big [4000+]", v:3, u:"Currency"},

        // SPACIAL SERIES
        {n:"Spacial [1-10]", v:10, u:"Currency"},
        {n:"Spacial [10-100]", v:7.5, u:"Currency"},
        {n:"Spacial [100-500]", v:6.25, u:"Currency"},
        {n:"Spacial [500-1000]", v:4, u:"Currency"},
        {n:"Spacial [1000-2000]", v:3.75, u:"Currency"},
        {n:"Spacial [2000-3000]", v:2.5, u:"Currency"},
        {n:"Spacial [3000+]", v:2, u:"Currency"},

        // SYNTHWAVE SERIES
        {n:"Synthwave [1-10]", v:8.75, u:"Currency"},
        {n:"Synthwave [10-100]", v:6.25, u:"Currency"},
        {n:"Synthwave [100-500]", v:4.5, u:"Currency"},
        {n:"Synthwave [500-1000]", v:3.5, u:"Currency"},
        {n:"Synthwave [1000-2000]", v:2.5, u:"Currency"},
        {n:"Synthwave [2000+]", v:2, u:"Currency"},

        // CHESS SERIES
        {n:"Chess [1-10]", v:6.25, u:"Currency"},
        {n:"Chess [10-100]", v:3.75, u:"Currency"},
        {n:"Chess [100-500]", v:2.5, u:"Currency"},
        {n:"Chess [500-1000]", v:1.75, u:"Currency"},
        {n:"Chess [1000-4000]", v:1.25, u:"Currency"},
        {n:"Chess [4000+]", v:0.75, u:"Currency"},

        // X RAW SERIES
        {n:"X Raw [1-10]", v:5, u:"Currency"},
        {n:"X Raw [10-100]", v:3.5, u:"Currency"},
        {n:"X Raw [100-500]", v:2, u:"Currency"},
        {n:"X Raw [500+]", v:1.5, u:"Currency"},

        // MISC GLOVES
        {n:"Earth", v:1, u:"Currency"},
        {n:"Reactor", v:1.1, u:"Currency"},
        {n:"Chains", v:0.45, u:"Currency"},
        {n:"Platinum", v:0.4, u:"Currency"},
        {n:"Za Warudo", v:0.4, u:"Currency"},
        {n:"Accelerator", v:0.2, u:"Currency"},
        {n:"Chaser", v:0.3, u:"Currency"},
        {n:"Danger", v:0.35, u:"Currency"},
        {n:"The Po0p", v:0.3, u:"Currency"},
        {n:"Dumbfounded", v:0.2, u:"Currency"},
        {n:"Poison", v:0.25, u:"Currency"},
        {n:"Spooky Slash", v:0.25, u:"Currency"},
        {n:"Spooky Splash", v:0.2, u:"Currency"},
        {n:"Diamond", v:0.2, u:"Currency"},
        {n:"Roux Vuitton", v:0.2, u:"Currency"},
        {n:"Meltdown", v:0.2, u:"Currency"},
        {n:"Aperture", v:0.15, u:"Currency"},
        {n:"Enchanted", v:0.15, u:"Currency"},

        // CORE PRESETS
        {n:"skibidi toilet", v:0, u:"N/A"},
        {n:"Kitty", v:350, u:"Currency"},
        {n:"Chocos", v:65, u:"Currency"}
    ];

    function setT(t) {
        target = t;
        document.getElementById('btnY').style.background = target === 'you' ? 'var(--p)' : '#222';
        document.getElementById('btnY').style.color = target === 'you' ? '#000' : '#fff';
        document.getElementById('btnT').style.background = target === 'them' ? 'var(--s)' : '#222';
        render();
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        document.getElementById('inv').innerHTML = data.filter(i => i.n.toLowerCase().includes(q)).sort((a,b)=>b.v-a.v).map(i => `
            <div class="card" onclick="add('${i.n}', ${i.v}, '${i.u}')">
                <span class="tag">${i.u}</span><br>
                ${i.n}<br><b>${i.v}</b>
            </div>
        `).join('');
    }

    function add(n, v, u) {
        if (target === 'you') yItems.push({n, v, u}); else tItems.push({n, v, u});
        upd();
    }

    function remove(side, i) {
        if (side === 'y') yItems.splice(i, 1); else tItems.splice(i, 1);
        upd();
    }

    function upd() {
        const yT = yItems.reduce((a, b) => a + b.v, 0);
        const tT = tItems.reduce((a, b) => a + b.v, 0);
        document.getElementById('yTotal').innerText = yT.toFixed(2);
        document.getElementById('tTotal').innerText = tT.toFixed(2);
        
        document.getElementById('yList').innerHTML = yItems.map((it, i) => `<div class="item" style="border-left-color:var(--p)">${it.n} <span class="tag">${it.v}</span> <span class="rem" onclick="remove('y', ${i})">✕</span></div>`).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) => `<div class="item" style="border-left-color:var(--s)">${it.n} <span class="tag">${it.v}</span> <span class="rem" onclick="remove('t', ${i})">✕</span></div>`).join('');
        
        const b = document.getElementById('banner'); const d = tT - yT;
        if (yT === 0 && tT === 0) { b.innerText = "System Ready"; b.className = "banner"; }
        else if (d > 0.01) { b.innerText = "PROFIT DETECTED (+" + d.toFixed(2) + ")"; b.className = "banner win-glow"; }
        else if (d < -0.01) { b.innerText = "DEFICIT WARNING (" + d.toFixed(2) + ")"; b.className = "banner loss-glow"; }
        else { b.innerText = "STABLE TRADE"; b.className = "banner"; }
    }
    setT('you'); render();
</script>
</body>
</html>

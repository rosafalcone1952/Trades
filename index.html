<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLOVE GOD V17: TRUE NORTH</title>
    <style>
        :root { 
            --p: #00f2ff; --s: #bc00ff; --win: #00ffa2; --loss: #ff2e5b; 
            --bg: #020204; --card: rgba(10, 10, 15, 0.9); 
        }
        
        * { box-sizing: border-box; font-family: 'Orbitron', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: linear-gradient(180deg, #050010 0%, var(--bg) 100%); 
            background-attachment: fixed; color: #fff; margin: 0; padding: 15px; min-height: 100vh;
        }

        /* Pure Neon Banner */
        .status-header { 
            width: 100%; padding: 25px; border-radius: 15px; text-align: center; 
            font-size: 1.5rem; font-weight: 900; margin-bottom: 25px; 
            border: 2px solid rgba(255,255,255,0.05); background: var(--card);
            backdrop-filter: blur(20px); transition: 0.4s; letter-spacing: 5px; 
            text-transform: uppercase;
        }
        
        .win-glow { border-color: var(--win); color: var(--win); box-shadow: 0 0 40px rgba(0,255,162,0.15); text-shadow: 0 0 10px var(--win); }
        .loss-glow { border-color: var(--loss); color: var(--loss); box-shadow: 0 0 40px rgba(255,46,91,0.15); text-shadow: 0 0 10px var(--loss); }
        .fair-glow { border-color: var(--p); color: var(--p); box-shadow: 0 0 40px rgba(0,242,255,0.1); text-shadow: 0 0 10px var(--p); }

        .trade-zone { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; }
        .side-panel { 
            flex: 1; min-width: 300px; background: var(--card); border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 20px; padding: 20px; position: relative;
        }
        
        .val-num { font-size: 3.5rem; text-align: center; font-weight: 900; margin: 10px 0; font-family: 'Courier New', monospace; }

        .search-container { position: sticky; top: 10px; z-index: 1000; margin-bottom: 20px; }
        .neon-input { 
            width: 100%; padding: 20px; border-radius: 12px; border: 1px solid #333; 
            background: #000; color: #fff; font-size: 1.1rem; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .toggle-row { display: flex; gap: 10px; margin-top: 10px; }
        .toggle-btn { 
            flex: 1; padding: 16px; border-radius: 10px; border: none; font-weight: 900; 
            cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }

        /* Smooth Card Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .card { 
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); 
            padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .card:hover { border-color: var(--p); background: rgba(0, 242, 255, 0.05); transform: scale(1.02); }
        .card b { display: block; font-size: 1.2rem; color: var(--win); margin: 5px 0; }
        .type-tag { font-size: 0.5rem; letter-spacing: 1px; color: #666; text-transform: uppercase; border: 1px solid #222; padding: 2px 5px; border-radius: 4px; }

        .list-item { 
            display: flex; justify-content: space-between; padding: 12px; 
            background: rgba(255,255,255,0.02); border-radius: 8px; margin-top: 6px; 
            font-size: 0.8rem; border-left: 3px solid; animation: pop 0.2s ease-out;
        }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .remove { color: var(--loss); cursor: pointer; font-weight: 900; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="status" class="status-header fair-glow">VERIFIED SYSTEM</div>

    <div class="trade-zone">
        <div class="side-panel" style="border-bottom: 4px solid var(--p);">
            <div id="yVal" class="val-num" style="color:var(--p)">0.00</div>
            <div id="yList"></div>
        </div>
        <div class="side-panel" style="border-bottom: 4px solid var(--s);">
            <div id="tVal" class="val-num" style="color:var(--s)">0.00</div>
            <div id="tList"></div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="query" class="neon-input" placeholder="SEARCH VERIFIED ITEMS..." onkeyup="render()">
        <div class="toggle-row">
            <button id="btnY" class="toggle-btn" style="background:var(--p); color:#000" onclick="setSide('y')">Player</button>
            <button id="btnT" class="toggle-btn" style="background:#111; color:#fff" onclick="setSide('t')">Opponent</button>
        </div>
    </div>

    <div id="inv" class="grid"></div>

<script>
    let side = 'y'; let yItems = []; let tItems = [];
    
    // VERIFIED GLOVE DATA (Stripped of fake variants)
    const data = [
        // CLASS X / ELITE
        {n:"Brush [1-10]", v:1900, u:"Curr", d:"Good"},
        {n:"Blackmarket", v:1400, u:"Curr", d:"Bad"},
        {n:"Tetro", v:1100, u:"Curr", d:"Bad"},
        {n:"M134 [1-5]", v:1015, u:"Curr", d:"Insane"},
        {n:"M134 Mid [37-62]", v:800, u:"Curr", d:"Insane"},
        {n:"M134 High [63+]", v:700, u:"Curr", d:"Insane"},
        {n:"MP5 [1-5]", v:760, u:"Curr", d:"Insane"},
        {n:"MP5 High [69+]", v:525, u:"Curr", d:"Insane"},
        
        // CLASS S
        {n:"BIGGER [1-5]", v:625, u:"Curr", d:"Decent"},
        {n:"BIGGER High [71+]", v:400, u:"Curr", d:"Good"},
        {n:"Runes [1-5]", v:575, u:"Curr", d:"Decent"},
        {n:"Runes High [77+]", v:345, u:"Curr", d:"Decent"},
        {n:"Kitty", v:400, u:"Curr", d:"Good"},
        {n:"M1911", v:350, u:"Curr", d:"Decent"},
        {n:"Chainsaw [1-5]", v:340, u:"Curr", d:"Good"},
        {n:"Frostbite [1-5]", v:300, u:"Curr", d:"Mid"},
        
        // VERIFIED CYBERFLYS
        {n:"Cyberfly [Original]", v:45, u:"Curr", d:"Good"},
        {n:"Cyberfly [Red]", v:25, u:"Curr", d:"Decent"},
        {n:"Cyberfly [Blue]", v:35, u:"Curr", d:"Good"},
        {n:"Cyberfly [Green]", v:20, u:"Curr", d:"Mid"},
        {n:"Cyberfly [White]", v:50, u:"Curr", d:"Good"},
        {n:"Cyberfly [Gold]", v:65, u:"Curr", d:"Insane"},
        
        // MIDS
        {n:"Chocos", v:80, u:"Curr", d:"Good"},
        {n:"Korone [1-10]", v:70, u:"Curr", d:"Good"},
        {n:"Bear [1-10]", v:62.5, u:"Curr", d:"Good"},
        {n:"Nuclear [1-10]", v:52.5, u:"Curr", d:"Decent"},
        {n:"Mecha", v:18, u:"Curr", d:"Decent"},
        {n:"Reactor", v:1.1, u:"Curr", d:"Good"},
        {n:"Earth", v:1, u:"Curr", d:"Mid"},
        
        // BLOXES
        {n:"Champion", v:6.25, u:"Blox", d:"Good"},
        {n:"Gold", v:6.25, u:"Blox", d:"Good"},
        {n:"Dos", v:5, u:"Blox", d:"Decent"},
        {n:"Chains", v:3.5, u:"Blox", d:"Good"}
    ];

    function calculate(v, d, u) {
        let base = (u === "Blox") ? v * 0.05 : v;
        let m = d.toLowerCase();
        if (m.includes("insane")) return base * 1.1;
        if (m.includes("good")) return base * 1.05;
        if (m.includes("bad")) return base * 0.9;
        return base;
    }

    function setSide(s) {
        side = s;
        document.getElementById('btnY').style.background = side === 'y' ? 'var(--p)' : '#111';
        document.getElementById('btnY').style.color = side === 'y' ? '#000' : '#fff';
        document.getElementById('btnT').style.background = side === 't' ? 'var(--s)' : '#111';
    }

    function render() {
        const q = document.getElementById('query').value.toLowerCase();
        document.getElementById('inv').innerHTML = data.filter(i => i.n.toLowerCase().includes(q)).sort((a,b)=>b.v-a.v).map(i => `
            <div class="card" onclick="add('${i.n}', ${i.v}, '${i.d}', '${i.u}')">
                <span class="type-tag">${i.u}</span>
                <b>${i.v}</b>
                <div style="font-size:0.7rem; color:#aaa">${i.n}</div>
            </div>
        `).join('');
    }

    function add(n, v, d, u) {
        const val = calculate(v, d, u);
        if (side === 'y') yItems.push({n, val}); else tItems.push({n, val});
        update();
    }

    function update() {
        const yT = yItems.reduce((a, b) => a + b.val, 0);
        const tT = tItems.reduce((a, b) => a + b.val, 0);
        document.getElementById('yVal').innerText = yT.toFixed(2);
        document.getElementById('tVal').innerText = tT.toFixed(2);
        
        document.getElementById('yList').innerHTML = yItems.map((it, i) => `<div class="list-item" style="border-color:var(--p)">${it.n} <span class="remove" onclick="yItems.splice(${i},1);update()">✕</span></div>`).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) => `<div class="list-item" style="border-color:var(--s)">${it.n} <span class="remove" onclick="tItems.splice(${i},1);update()">✕</span></div>`).join('');
        
        const b = document.getElementById('status'); const diff = tT - yT;
        if (yT + tT === 0) { b.innerText = "VERIFIED SYSTEM"; b.className = "status-header fair-glow"; }
        else if (diff > 0.05) { b.innerText = "PROFIT (+" + diff.toFixed(2) + ")"; b.className = "status-header win-glow"; }
        else if (diff < -0.05) { b.innerText = "LOSS (" + diff.toFixed(2) + ")"; b.className = "status-header loss-glow"; }
        else { b.innerText = "FAIR OFFER"; b.className = "status-header fair-glow"; }
    }
    setSide('y'); render();
</script>
</body>
</html>

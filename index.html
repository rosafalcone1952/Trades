<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Trade Master</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: #fff; padding: 10px; margin: 0; }
        .banner { width: 100%; padding: 20px; border-radius: 10px; text-align: center; font-size: 1.8em; font-weight: bold; margin-bottom: 10px; border: 2px solid #333; }
        .win { background: #1b5e20; color: #00ff88; border-color: #00ff88; }
        .loss { background: #b71c1c; color: #ff3e3e; border-color: #ff3e3e; }
        .fair { background: #f39c12; color: #fff; }
        .calc-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .side { flex: 1; background: #111; padding: 15px; border-radius: 10px; border: 2px solid #444; }
        .total { font-size: 2em; font-weight: bold; text-align: center; margin: 10px 0; color: #00ff88; }
        .search-bar { width: 100%; padding: 15px; background: #222; border: 1px solid #555; color: #fff; border-radius: 8px; margin-bottom: 10px; font-size: 1.1em; }
        .inventory { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; max-height: 400px; overflow-y: auto; padding: 5px; background: #000; border-radius: 8px; }
        .item-card { background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.8em; }
        .item-card:hover { border-color: #00ff88; }
        .selected-item { background: #222; padding: 8px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; font-size: 0.9em; border-left: 4px solid #333; }
        .you .selected-item { border-left-color: #3498db; }
        .them .selected-item { border-left-color: #e74c3c; }
        .remove { color: #ff3e3e; font-weight: bold; cursor: pointer; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .mode-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="banner" class="banner fair">ADD ITEMS</div>

    <div class="calc-box">
        <div class="side you">
            <h3 style="text-align:center;color:#3498db;margin:0;">YOU</h3>
            <div id="yTotal" class="total">0.00</div>
            <div id="yList"></div>
        </div>
        <div class="side them">
            <h3 style="text-align:center;color:#e74c3c;margin:0;">THEM</h3>
            <div id="tTotal" class="total">0.00</div>
            <div id="tList"></div>
        </div>
    </div>

    <input type="text" id="search" class="search-bar" placeholder="Search EVERYTHING..." onkeyup="render()">
    
    <div class="btn-row">
        <button id="btnY" class="mode-btn" style="background:#3498db;color:#fff;" onclick="target='you';render()">Adding to YOU</button>
        <button id="btnT" class="mode-btn" style="background:#444;color:#fff;" onclick="target='them';render()">Adding to THEM</button>
    </div>

    <div id="inv" class="inventory"></div>

<script>
    let target = 'you'; let yItems = []; let tItems = [];
    
    const data = [
        // TOP TIERS
        {n: "Brush [1-10]", v: 1900, d: "Good"}, {n: "Blackmarket", v: 1400, d: "Bad"}, {n: "Tetro", v: 1100, d: "Bad"}, {n: "skibidi toilet", v: 1000, d: "Insane"},
        // M134 FULL RANGE
        {n: "M134 [1-5]", v: 955, d: "Insane"}, {n: "M134 [6-10]", v: 900, d: "Insane"}, {n: "M134 [11-36]", v: 805, d: "Insane"}, {n: "M134 [37-62]", v: 735, d: "Insane"}, {n: "M134 [63-100]", v: 655, d: "Insane"}, {n: "M134 [101-500]", v: 550, d: "Good"}, {n: "M134 [501+]", v: 450, d: "Mid"},
        // MP5 FULL RANGE
        {n: "MP5 [1-5]", v: 740, d: "Insane"}, {n: "MP5 [6-10]", v: 665, d: "Insane"}, {n: "MP5 [11-39]", v: 565, d: "Insane"}, {n: "MP5 [40-68]", v: 540, d: "Insane"}, {n: "MP5 [69-100]", v: 500, d: "Insane"}, {n: "MP5 [101+]", v: 400, d: "Good"},
        // BIGGER FULL RANGE
        {n: "BIGGER [1-5]", v: 595, d: "Decent"}, {n: "BIGGER [6-10]", v: 540, d: "Decent"}, {n: "BIGGER [11-40]", v: 490, d: "Decent"}, {n: "BIGGER [41-70]", v: 425, d: "Decent"}, {n: "BIGGER [71-100]", v: 355, d: "Decent"}, {n: "BIGGER [101+]", v: 280, d: "Mid"},
        // RUNES & KITTY
        {n: "Runes [1-5]", v: 575, d: "Mid"}, {n: "Runes [6-10]", v: 520, d: "Mid"}, {n: "Runes [11+]", v: 400, d: "Mid"}, {n: "Kitty", v: 350, d: "Insane"}, {n: "M1911", v: 340, d: "Good"},
        // FROSTBITE & CHAINSAW
        {n: "Frostbite [1-5]", v: 270, d: "Mid"}, {n: "Frostbite [6-10]", v: 255, d: "Mid"}, {n: "Frostbite [11-45]", v: 230, d: "Mid"}, {n: "Frostbite [46-84]", v: 210, d: "Mid"}, {n: "Frostbite [85+]", v: 190, d: "Mid"},
        {n: "Chainsaw [1-5]", v: 295, d: "Good"}, {n: "Chainsaw [6-10]", v: 270, d: "Good"}, {n: "Eradese [1-5]", v: 280, d: "Good"}, {n: "Phantom [1-5]", v: 240, d: "Mid"}, {n: "Freezer [1-5]", v: 210, d: "Decent"}, {n: "Vortex [1-5]", v: 190, d: "Bad"},
        // MID TIERS
        {n: "Chocos", v: 65, d: "Good"}, {n: "Korone [1-10]", v: 65, d: "Good"}, {n: "Bear [1-10]", v: 57.5, d: "Good"}, {n: "Nuclear [1-10]", v: 52.5, d: "Decent"},
        {n: "Chronos [1-10]", v: 45, d: "Good"}, {n: "Cyberfly [BLK]", v: 40, d: "Good"}, {n: "Cyberfly [WHT]", v: 35, d: "Decent"}, {n: "Mecha", v: 19, d: "Decent"},
        // LOW TIERS
        {n: "Shrimple [1-10]", v: 18.75, d: "Bad"}, {n: "Big [1-10]", v: 13.75, d: "Mid"}, {n: "Creature [1-10]", v: 12.5, d: "Bad"}, {n: "Violin [1-10]", v: 10, d: "Bad"}, {n: "Spacial [1-10]", v: 10, d: "Bad"}, {n: "Synth [1-10]", v: 8.75, d: "Bad"}, {n: "Death", v: 7.5, d: "Mid"}, {n: "Brute", v: 4.75, d: "Good"}, {n: "Wildcard", v: 3.75, d: "Bad"}, {n: "Roadster", v: 3.25, d: "Good"}, {n: "Dubstep", v: 2.5, d: "Decent"}, {n: "Reactor", v: 1.1, d: "Good"}, {n: "Earth", v: 1, d: "Mid"}, {n: "Water", v: 0.8, d: "Bad"},
        // BLOX SERIES
        {n: "Champion (Blox)", v: 0.125, d: "Decent"}, {n: "Gold (Blox)", v: 0.125, d: "Decent"}, {n: "Dos (Blox)", v: 0.10, d: "Mid"}, {n: "Chains (Blox)", v: 0.07, d: "Good"}, {n: "Murder (Blox)", v: 0.03, d: "Good"}, {n: "Full Metal (Blox)", v: 0.01, d: "Good"}, {n: "Classic (Blox)", v: 0.005, d: "Mid"}
    ];

    function calc(v, d) {
        let dm = d.toLowerCase();
        if (dm === "insane") return v + 0.2; if (dm === "good") return v + 0.1;
        if (dm === "bad") return v - 0.2; if (dm === "mid") return v - 0.05; return v;
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        document.getElementById('inv').innerHTML = data.filter(i => i.n.toLowerCase().includes(q)).sort((a,b) => b.v - a.v).map(i => `
            <div class="item-card" onclick="add('${i.n}', ${i.v}, '${i.d}')">${i.n}<br><b>${calc(i.v, i.d).toFixed(2)}</b></div>
        `).join('');
        document.getElementById('btnY').style.background = target === 'you' ? '#3498db' : '#444';
        document.getElementById('btnT').style.background = target === 'them' ? '#e74c3c' : '#444';
    }

    function add(n, v, d) {
        const val = calc(v, d);
        if (target === 'you') yItems.push({n, val}); else tItems.push({n, val});
        update();
    }

    function remove(side, i) {
        if (side === 'y') yItems.splice(i, 1); else tItems.splice(i, 1);
        update();
    }

    function update() {
        const yT = yItems.reduce((a, b) => a + b.val, 0);
        const tT = tItems.reduce((a, b) => a + b.val, 0);
        document.getElementById('yTotal').innerText = yT.toFixed(2);
        document.getElementById('tTotal').innerText = tT.toFixed(2);
        document.getElementById('yList').innerHTML = yItems.map((it, i) => `<div class="selected-item">${it.n} <span class="remove" onclick="remove('y', ${i})">X</span></div>`).join('');
        document.getElementById('tList').innerHTML = tItems.map((it, i) => `<div class="selected-item">${it.n} <span class="remove" onclick="remove('t', ${i})">X</span></div>`).join('');
        
        const b = document.getElementById('banner');
        const diff = tT - yT;
        if (yT === 0 && tT === 0) { b.innerText = "ADD ITEMS"; b.className = "banner fair"; }
        else if (diff > 0.009) { b.innerText = "WIN (+" + diff.toFixed(2) + ")"; b.className = "banner win"; }
        else if (diff < -0.009) { b.innerText = "LOSS (" + diff.toFixed(2) + ")"; b.className = "banner loss"; }
        else { b.innerText = "FAIR TRADE"; b.className = "banner fair"; }
    }
    render();
</script>
</body>
</html>
